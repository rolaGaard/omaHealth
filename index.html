<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso protegido</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f4f4f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0b0b0b;padding:20px}
  @media (prefers-color-scheme:dark){body{background:#0d0d0d;color:#fff}}
  .box{background:#fff;border:1px solid rgba(11,11,11,.10);border-radius:16px;padding:30px 28px;
    max-width:380px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
  @media (prefers-color-scheme:dark){.box{background:#1f1f1d;border-color:rgba(255,255,255,.12)}}
  .ic{font-size:34px;margin-bottom:6px}
  h1{font-size:19px;margin:0 0 4px}
  p{font-size:13.5px;color:#52514e;margin:0 0 20px;line-height:1.5}
  @media (prefers-color-scheme:dark){p{color:#c3c2b7}}
  input{width:100%;padding:12px 14px;font-size:15px;border:1px solid rgba(11,11,11,.18);border-radius:10px;
    font-family:inherit;background:#fcfcfb;color:#0b0b0b}
  @media (prefers-color-scheme:dark){input{background:#141413;color:#fff;border-color:rgba(255,255,255,.18)}}
  input:focus{outline:2px solid #2a78d6;border-color:#2a78d6}
  button{width:100%;margin-top:12px;padding:12px;font-size:15px;font-weight:600;border:none;border-radius:10px;
    background:#2a78d6;color:#fff;cursor:pointer;font-family:inherit}
  button:hover{background:#256abf}
  .err{color:#d03b3b;font-size:13px;margin-top:12px;min-height:18px}
  .foot{font-size:11.5px;color:#898781;margin-top:18px}
</style>
</head>
<body>
  <form class="box" id="f" onsubmit="return unlock(event)">
    <div class="ic">🔒</div>
    <h1>Historial clínico — Oma</h1>
    <p>Contenido protegido. Ingresá la contraseña para ver el dashboard.</p>
    <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" autofocus>
    <button type="submit" id="btn">Ingresar</button>
    <div class="err" id="err"></div>
    <div class="foot">Los datos se descifran en tu dispositivo. La contraseña no se envía a ningún servidor.</div>
  </form>
